# Local PostgreSQL for development and tests. Started by `npm run setup` / `npm run db:up`.
# Values come from .env.local (created by `npm run setup`); nothing secret is stored here.
services:
  db:
    image: postgres:17-alpine
    container_name: sai-platform-db
    environment:
      POSTGRES_USER: sai_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?run npm run setup first}
      POSTGRES_DB: sai
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sai_owner -d sai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sai_pgdata:
